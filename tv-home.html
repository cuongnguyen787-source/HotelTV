<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hotel TV Welcome</title>
  <style>
    :root {
      --bg-dark: #2c1d17;
      --card-bg: rgba(145, 102, 78, 0.72);
      --card-border: rgba(255, 235, 215, 0.35);
      --accent: #f3c68f;
      --focus-bg: rgba(74, 47, 30, 0.92);
      --text-main: #f7efe6;
      --text-muted: #cbbba8;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100vw;
      height: 100%;
      background: radial-gradient(circle at top right, #4a2e22, var(--bg-dark) 70%);
      color: var(--text-main);
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
      box-sizing: border-box;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    .tv-app {
      width: 100%;
      height: 100%;
      padding: 20px 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .welcome-title {
      margin: 0;
      font-size: 32px;
      line-height: 1.15;
      font-weight: 700;
      color: var(--text-main);
    }

    .sub-info {
      margin-top: 4px;
      font-size: 15px;
      color: var(--text-muted);
    }

    .right-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .clock-box {
      text-align: right;
      font-size: 14px;
      color: var(--text-muted);
    }

    .lang-btn {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1.5px solid var(--card-border);
      background: rgba(255, 255, 255, 0.14);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      max-height: 48px;
    }

    .lang-btn:focus,
    .lang-btn:hover {
      outline: none;
      border-color: var(--accent);
      background: var(--focus-bg);
      box-shadow: 0 0 0 3px var(--accent);
    }

    .main-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr)) minmax(200px, 1.1fr);
      gap: 14px;
      align-items: stretch;
      height: 210px;
      max-height: 36vh;
    }

    .menu-card,
    .promo-card {
      position: relative;
      border-radius: 12px;
      border: 1.5px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-main);
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      text-align: center;
      height: 100%;
      transition: transform 0.12s ease, border-color 0.12s ease;
    }

    .promo-card {
      background: #f5f5f5;
      color: #181818;
      justify-content: space-between;
      padding: 12px 14px;
    }

    .menu-card:focus,
    .menu-card:hover {
      outline: none;
      border-color: var(--accent);
      background: var(--focus-bg);
      box-shadow: 0 0 0 3px var(--accent);
      transform: translateY(-2px);
    }

    .promo-card:focus,
    .promo-card:hover {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent);
      transform: translateY(-2px);
    }

    .card-icon {
      font-size: 32px;
      line-height: 1;
    }

    .card-label {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .promo-play {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 3px solid #181818;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: auto;
      font-size: 22px;
      padding-left: 3px;
    }

    .promo-title {
      font-size: 14px;
      font-weight: 800;
      text-align: left;
      width: 100%;
    }

    .promo-sub {
      font-size: 11px;
      color: #444;
      text-align: left;
      width: 100%;
    }

    .promo-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }

    .promo-modal.active {
      display: flex;
    }

    .promo-modal video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .close-promo-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 10000;
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }

    @media (max-width: 820px) {
      html, body {
        height: auto;
        min-height: 100vh;
        overflow-y: auto;
      }
      .tv-app {
        height: auto;
        padding: 14px;
      }
      .welcome-title {
        font-size: 24px;
      }
      .main-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        height: auto;
        max-height: none;
      }
      .menu-card,
      .promo-card {
        min-height: 120px;
        height: auto;
      }
    }
  </style>
</head>
<body>
  <div class="tv-app">
    <header class="top-bar">
      <div>
        <h1 class="welcome-title" id="welcomeText">Welcome,<br>Guest</h1>
        <div class="sub-info" id="roomBadge">Room: ---</div>
      </div>

      <div class="right-controls">
        <div class="clock-box" id="clockText"></div>
        <button type="button" class="lang-btn" id="langToggleBtn" tabindex="0">VI</button>
      </div>
    </header>

    <main class="main-grid" id="cardGrid">
      <button type="button" class="menu-card" id="btnTv" tabindex="0">
        <div class="card-icon">📺</div>
        <div class="card-label" id="lblTv">TV CHANNELS</div>
      </button>

      <button type="button" class="menu-card" id="btnMovies" tabindex="0">
        <div class="card-icon">🎬</div>
        <div class="card-label" id="lblMovies">MOVIES</div>
      </button>

      <button type="button" class="menu-card" id="btnServices" tabindex="0">
        <div class="card-icon">🛎️</div>
        <div class="card-label" id="lblServices">HOTEL SERVICES</div>
      </button>

      <button type="button" class="menu-card" id="btnRoomService" tabindex="0">
        <div class="card-icon">🍽️</div>
        <div class="card-label" id="lblRoomService">ROOM SERVICE</div>
      </button>

      <button type="button" class="promo-card" id="btnPromo" tabindex="0">
        <div class="promo-play">▶</div>
        <div>
          <div class="promo-title" id="lblPromoTitle">HOTEL HIGHLIGHTS</div>
          <div class="promo-sub" id="lblPromoSub">Promotions video • OK</div>
        </div>
      </button>
    </main>
  </div>

  <div class="promo-modal" id="promoModal">
    <button type="button" class="close-promo-btn" id="closePromoBtn" tabindex="0">✕ Close</button>
    <video id="promoVideo" controls autoplay playsinline>
      <source src="https://YOUR-R2-BUCKET-URL/promo.mp4" type="video/mp4" />
    </video>
  </div>

  <script>
    (function() {
      var memoryStore = {};
      function getPref(key, fallback) {
        try {
          var v = window.localStorage.getItem(key);
          return v !== null ? v : fallback;
        } catch (e) {
          return Object.prototype.hasOwnProperty.call(memoryStore, key) ? memoryStore[key] : fallback;
        }
      }
      function setPref(key, val) {
        try {
          window.localStorage.setItem(key, String(val));
        } catch (e) {
          memoryStore[key] = String(val);
        }
      }

      var params = new URLSearchParams(window.location.search || '');
      var room = (params.get('room') || '101').trim();
      var urlGreeting = (params.get('greeting') || '').trim();

      var i18n = {
        en: {
          welcome: 'Welcome,<br>Guest',
          room: 'Room ' + room,
          tv: 'TV CHANNELS',
          movies: 'MOVIES',
          services: 'HOTEL SERVICES',
          roomService: 'ROOM SERVICE',
          promoTitle: 'HOTEL HIGHLIGHTS',
          promoSub: 'Promotions video • OK',
          langBtn: 'VI'
        },
        vi: {
          welcome: 'Xin chào,<br>Quý khách',
          room: 'Phòng ' + room,
          tv: 'TRUYỀN HÌNH',
          movies: 'KHO PHIM',
          services: 'DỊCH VỤ KHÁCH SẠN',
          roomService: 'ĐẶT ĐỒ PHÒNG',
          promoTitle: 'ƯU ĐÃI KHÁCH SẠN',
          promoSub: 'Video giới thiệu • Bấm OK',
          langBtn: 'EN'
        }
      };

      var currentLang = getPref('hotel_lang', 'en');
      if (!i18n[currentLang]) currentLang = 'en';

      function applyCustomGreetingIfAny() {
        var el = document.getElementById('welcomeText');
        if (!el) return;
        var custom = urlGreeting || getPref('room_greeting_' + room, '');
        if (custom && String(custom).trim() !== '') {
          el.innerHTML = String(custom).trim().replace(/\n/g, '<br>');
        }
      }

      function applyLang(lang) {
        currentLang = lang;
        setPref('hotel_lang', lang);
        var t = i18n[lang];
        document.getElementById('welcomeText').innerHTML = t.welcome;
        document.getElementById('roomBadge').textContent = t.room;
        document.getElementById('lblTv').textContent = t.tv;
        document.getElementById('lblMovies').textContent = t.movies;
        document.getElementById('lblServices').textContent = t.services;
        document.getElementById('lblRoomService').textContent = t.roomService;
        document.getElementById('lblPromoTitle').textContent = t.promoTitle;
        document.getElementById('lblPromoSub').textContent = t.promoSub;
        document.getElementById('langToggleBtn').textContent = t.langBtn;
        applyCustomGreetingIfAny();
      }

      function fetchRemoteRoomGreeting() {
        if (typeof fetch !== 'function') return;
        var apiUrl = 'https://YOUR-WORKER-URL/api/room?room=' + encodeURIComponent(room) + '&_t=' + Date.now();
        fetch(apiUrl, { cache: 'no-store' })
          .then(function(res) { return res.ok ? res.json() : null; })
          .then(function(data) {
            if (!data) return;
            var serverGreeting = data.greeting || data.welcome || data.message || (data.data && data.data.greeting);
            if (serverGreeting && String(serverGreeting).trim() !== '') {
              setPref('room_greeting_' + room, String(serverGreeting).trim());
              applyCustomGreetingIfAny();
            }
          })
          .catch(function() {});
      }

      function updateClock() {
        var now = new Date();
        var opts = { weekday: 'long', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
        document.getElementById('clockText').textContent = now.toLocaleString(currentLang === 'vi' ? 'vi-VN' : 'en-US', opts);
      }

      function launchNativeApp(pkg) {
        if (window.AndroidBridge && typeof window.AndroidBridge.launchApp === 'function') {
          window.AndroidBridge.launchApp(pkg);
        }
      }

      var promoModal = document.getElementById('promoModal');
      var promoVideo = document.getElementById('promoVideo');

      function openPromo() {
        promoModal.classList.add('active');
        try {
          promoVideo.currentTime = 0;
          var p = promoVideo.play();
          if (p && p.catch) p.catch(function(){});
        } catch (e) {}
      }

      function closePromo() {
        promoModal.classList.remove('active');
        try {
          promoVideo.pause();
        } catch (e) {}
        document.getElementById('btnPromo').focus();
      }

      window.closePromoIfOpen = function() {
        if (promoModal.classList.contains('active')) {
          closePromo();
          return true;
        }
        return false;
      };

      document.getElementById('langToggleBtn').addEventListener('click', function() {
        applyLang(currentLang === 'en' ? 'vi' : 'en');
        updateClock();
      });

      document.getElementById('btnTv').addEventListener('click', function() {
        launchNativeApp('com.vtvprime.ott');
      });

      document.getElementById('btnMovies').addEventListener('click', function() {
        launchNativeApp('org.xbmc.kodi');
      });

      document.getElementById('btnServices').addEventListener('click', openPromo);
      document.getElementById('btnRoomService').addEventListener('click', openPromo);
      document.getElementById('btnPromo').addEventListener('click', openPromo);
      document.getElementById('closePromoBtn').addEventListener('click', closePromo);

      var focusList = [
        document.getElementById('langToggleBtn'),
        document.getElementById('btnTv'),
        document.getElementById('btnMovies'),
        document.getElementById('btnServices'),
        document.getElementById('btnRoomService'),
        document.getElementById('btnPromo')
      ];

      document.addEventListener('keydown', function(e) {
        if (promoModal.classList.contains('active')) {
          if (e.key === 'Escape' || e.keyCode === 4 || e.keyCode === 27) {
            e.preventDefault();
            closePromo();
          }
          return;
        }

        var idx = focusList.indexOf(document.activeElement);
        if (e.keyCode === 39 || e.keyCode === 22) {
          e.preventDefault();
          var next = focusList[(idx + 1 + focusList.length) % focusList.length];
          if (next) next.focus();
        } else if (e.keyCode === 37 || e.keyCode === 21) {
          e.preventDefault();
          var prev = focusList[(idx - 1 + focusList.length) % focusList.length];
          if (prev) prev.focus();
        } else if (e.keyCode === 13 || e.keyCode === 23) {
          if (document.activeElement && document.activeElement !== document.body) {
            e.preventDefault();
            document.activeElement.click();
          }
        }
      });

      applyLang(currentLang);
      fetchRemoteRoomGreeting();
      updateClock();
      setInterval(updateClock, 30000);
      setTimeout(function() {
        document.getElementById('btnTv').focus();
      }, 200);
    })();
  </script>
</body>
</html>
