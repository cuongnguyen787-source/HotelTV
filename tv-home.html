<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hotel TV Welcome</title>
  <style>
    :root {
      --bg-dark: #0f141c;
      --bg-card: rgba(255, 255, 255, 0.08);
      --bg-card-hover: rgba(255, 255, 255, 0.16);
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.18);
      --text-main: #f8fafc;
      --text-sub: #cbd5e1;
      --border: rgba(255, 255, 255, 0.14);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      max-width: 100vw;
      min-height: 100vh;
      overflow-x: hidden;
      background: radial-gradient(circle at top right, #1e293b, var(--bg-dark) 65%);
      color: var(--text-main);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.45;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .app-shell {
      width: 100%;
      max-width: 1360px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 20px 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 20px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 14px 20px;
      border-radius: 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
    }

    .hotel-title {
      font-size: clamp(18px, 2vw, 26px);
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .hotel-sub {
      font-size: clamp(12px, 1.2vw, 14px);
      color: var(--text-sub);
    }

    .room-badge {
      padding: 8px 16px;
      border-radius: 999px;
      background: var(--accent-soft);
      border: 1px solid var(--accent);
      color: #e0f2fe;
      font-size: clamp(13px, 1.3vw, 16px);
      font-weight: 700;
      white-space: nowrap;
    }

    .main-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 18px;
      width: 100%;
    }

    .tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 150px;
      padding: 20px 16px;
      border-radius: 18px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      font-size: clamp(15px, 1.5vw, 20px);
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      outline: none;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }

    .tile:hover,
    .tile:focus {
      background: var(--bg-card-hover);
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 0 0 2px var(--accent);
    }

    .tile-icon {
      font-size: clamp(28px, 3vw, 40px);
      line-height: 1;
    }

    .tile-desc {
      font-size: clamp(12px, 1.1vw, 14px);
      font-weight: 400;
      color: var(--text-sub);
    }

    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding: 10px 18px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border);
      font-size: clamp(12px, 1.1vw, 14px);
      color: var(--text-sub);
    }

    /* Modal danh sách app TV / thông tin */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.82);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 99;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 640px;
      max-height: 85vh;
      overflow-y: auto;
      background: #141c28;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
    }

    .btn-close {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      cursor: pointer;
    }

    .app-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    .app-item {
      padding: 14px;
      border-radius: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      font-size: 15px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
    }

    .app-item:hover,
    .app-item:focus {
      border-color: var(--accent);
      background: var(--bg-card-hover);
      outline: none;
    }

    .app-pkg {
      display: block;
      margin-top: 4px;
      font-size: 11px;
      font-weight: 400;
      color: var(--text-sub);
      word-break: break-all;
    }

    @media (max-width: 640px) {
      .app-shell {
        padding: 14px;
      }
      .main-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      .tile {
        min-height: 120px;
        padding: 14px 10px;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <div>
        <div class="hotel-title">Chào mừng Quý khách</div>
        <div class="hotel-sub" id="welcomeText">Kính chúc Quý khách kỳ nghỉ thoải mái và thuận tiện</div>
      </div>
      <div class="room-badge" id="roomBadge">Phòng --</div>
    </header>

    <main class="main-grid" id="mainMenu">
      <button class="tile" type="button" onclick="openTvChannels()">
        <span class="tile-icon">📺</span>
        <span>TV CHANNELS</span>
        <span class="tile-desc">Truyền hình &amp; giải trí</span>
      </button>

      <button class="tile" type="button" onclick="openMovies()">
        <span class="tile-icon">🎬</span>
        <span>MOVIES</span>
        <span class="tile-desc">Kho phim &amp; media phòng</span>
      </button>

      <button class="tile" type="button" onclick="openInfoModal('Dịch vụ khách sạn', 'Lễ tân: bấm phím gọi nội bộ hoặc liên hệ quầy lễ tân 24/7.\nWifi: Kết nối mạng phòng và nhập mật khẩu thông báo tại bàn.')">
        <span class="tile-icon">🛎️</span>
        <span>SERVICES</span>
        <span class="tile-desc">Thông tin &amp; hỗ trợ phòng</span>
      </button>

      <button class="tile" type="button" onclick="openInfoModal('Giới thiệu', 'Hệ thống giải trí thông minh dành riêng cho khách lưu trú.')">
        <span class="tile-icon">ℹ️</span>
        <span>ABOUT</span>
        <span class="tile-desc">Hướng dẫn sử dụng TV</span>
      </button>
    </main>

    <footer class="bottom-bar">
      <span id="clockText">--:--</span>
      <span>Dùng phím mũi tên &amp; OK để chọn • Bấm 0 (5 lần) để cấu hình</span>
    </footer>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">Danh sách ứng dụng TV</div>
        <button class="btn-close" type="button" onclick="closeModal()">Đóng</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const roomCode = (params.get("room") || "101").trim();

    document.getElementById("roomBadge").textContent = "Phòng " + roomCode;
    document.getElementById("welcomeText").textContent =
      "Chào mừng Quý khách đến với Phòng " + roomCode;

    function updateClock() {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      document.getElementById("clockText").textContent = hh + ":" + mm;
    }
    updateClock();
    setInterval(updateClock, 15000);

    function openModal(title, htmlContent) {
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("modalBody").innerHTML = htmlContent;
      document.getElementById("modalBackdrop").classList.add("open");
    }

    function closeModal() {
      document.getElementById("modalBackdrop").classList.remove("open");
      const firstTile = document.querySelector(".main-grid .tile");
      if (firstTile) firstTile.focus();
    }

    // Được gọi từ Android khi người dùng bấm phím Back
    window.handleAndroidBack = function () {
      const backdrop = document.getElementById("modalBackdrop");
      if (backdrop.classList.contains("open")) {
        closeModal();
      }
    };

    function launchTvPackage(pkg) {
      if (window.AndroidBridge && typeof window.AndroidBridge.launchApp === "function") {
        window.AndroidBridge.launchApp(pkg, "open", roomCode);
      } else {
        openInfoModal("Chế độ trình duyệt", "Đang chạy ngoài AndroidBridge. Package mục tiêu: " + pkg);
      }
    }

    function openTvChannels() {
      let apps = [];
      if (window.AndroidBridge && typeof window.AndroidBridge.getTvAppsJson === "function") {
        try {
          const raw = window.AndroidBridge.getTvAppsJson();
          apps = JSON.parse(raw || "[]");
        } catch (e) {
          apps = [];
        }
      }

      if (!Array.isArray(apps) || apps.length === 0) {
        apps = [
          { name: "VTVprime", pkg: "com.vtvprime.tv" },
          { name: "FPT Play", pkg: "com.fptplay.activity" },
          { name: "TiviMate", pkg: "ar.tvplayer.tv" },
          { name: "OTT Navigator", pkg: "studio.scillarium.ottnavigator" },
          { name: "Kodi", pkg: "org.xbmc.kodi" }
        ];
      }

      const itemsHtml = apps.map(app =>
        `<button class="app-item" type="button" onclick="launchTvPackage('${app.pkg}')">
          <span>${app.name}</span>
          <span class="app-pkg">${app.pkg}</span>
        </button>`
      ).join("");

      openModal("TV CHANNELS — Phòng " + roomCode, `<div class="app-list">${itemsHtml}</div>`);
    }

    function openMovies() {
      openInfoModal(
        "MOVIES — Phòng " + roomCode,
        "Khu vực phát video / phim chào mừng hoặc danh mục media cho phòng " + roomCode + "."
      );
    }

    function openInfoModal(title, message) {
      const safeMsg = String(message).replace(/\n/g, "<br>");
      openModal(title, `<p style="color:#e2e8f0;font-size:15px;">${safeMsg}</p>`);
    }

    window.addEventListener("DOMContentLoaded", () => {
      const firstTile = document.querySelector(".main-grid .tile");
      if (firstTile) firstTile.focus();
    });
  </script>
</body>
</html>
