<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hotel TV Welcome</title>
  <style>
    :root {
      --bg-top: #18100b;
      --bg-bottom: #261810;
      --card-bg: rgba(42, 27, 18, 0.78);
      --card-border: rgba(255, 235, 210, 0.22);
      --focus-border: #f5b971;
      --focus-bg: rgba(74, 47, 30, 0.94);
      --text-main: #f7efe6;
      --text-muted: #cbbba8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      outline: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", Roboto, "Noto Sans JP", "Noto Sans SC", "Noto Sans KR", Arial, sans-serif;
      color: var(--text-main);
      background: radial-gradient(circle at 20% 25%, #2c1c12 0%, var(--bg-top) 45%, var(--bg-bottom) 100%);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    body.has-bg-image::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(
        90deg,
        rgba(16, 10, 6, 0.76) 0%,
        rgba(16, 10, 6, 0.50) 55%,
        rgba(16, 10, 6, 0.74) 100%
      );
      pointer-events: none;
      z-index: 0;
    }

    .screen {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      padding: 24px 42px 32px 42px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
    }

    .welcome-box {
      max-width: 66%;
    }

    .hotel-brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .hotel-logo-img {
      height: 44px;
      max-width: 140px;
      object-fit: contain;
      border-radius: 8px;
      background: rgba(255, 244, 228, 0.1);
      padding: 4px 8px;
      border: 1px solid rgba(255, 235, 210, 0.2);
      display: none;
    }

    .hotel-logo-img.visible {
      display: block;
    }

    .hotel-brand-name {
      font-size: clamp(16px, 1.55vw, 24px);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--focus-border);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
    }

    .welcome-title {
      font-size: clamp(32px, 3.9vw, 62px);
      font-weight: 500;
      line-height: 1.08;
      letter-spacing: -0.02em;
      color: var(--text-main);
      margin-bottom: 8px;
      word-break: break-word;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.55);
    }

    .welcome-room {
      font-size: clamp(19px, 1.8vw, 28px);
      font-weight: 500;
      color: var(--text-main);
      letter-spacing: 0.02em;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.55);
    }

    .wifi-info {
      margin-top: 8px;
      display: none;
      align-items: center;
      gap: 8px;
      font-size: clamp(13px, 1.2vw, 16px);
      color: var(--text-muted);
      background: rgba(20, 12, 8, 0.56);
      border: 1px solid rgba(255, 235, 210, 0.16);
      border-radius: 8px;
      padding: 5px 11px;
      width: fit-content;
      max-width: 100%;
    }

    .wifi-info.visible {
      display: inline-flex;
    }

    .wifi-info svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      stroke: var(--focus-border);
      fill: none;
      stroke-width: 2;
    }

    .wifi-info strong {
      color: var(--text-main);
      font-weight: 600;
    }

    .meta-box {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .clock-line {
      font-size: clamp(15px, 1.4vw, 21px);
      color: var(--text-muted);
    }

    .clock-line .time-strong {
      color: var(--text-main);
      font-weight: 600;
      margin-left: 8px;
    }

    .weather-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
    }

    .weather-icon {
      width: 34px;
      height: 34px;
      stroke: var(--text-main);
      fill: none;
      stroke-width: 2;
    }

    .weather-temp-main {
      font-size: clamp(24px, 2.4vw, 38px);
      font-weight: 500;
      line-height: 1;
    }

    .weather-temp-sub {
      font-size: clamp(13px, 1.1vw, 17px);
      color: var(--text-muted);
      text-align: left;
      line-height: 1.2;
    }

    .lang-switch {
      margin-top: 2px;
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-size: clamp(13px, 1.1vw, 16px);
      cursor: pointer;
      transition: transform 0.14s ease, border-color 0.14s ease, background-color 0.14s ease;
    }

    .lang-switch .active-lang {
      color: var(--text-main);
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .lang-switch:focus,
    .lang-switch.tv-focused {
      border-color: var(--focus-border);
      background: var(--focus-bg);
      color: var(--text-main);
      transform: scale(1.03);
    }

    .bottom-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr)) minmax(180px, 1.45fr);
      gap: 16px;
      width: 100%;
    }

    .menu-card {
      height: 168px;
      max-height: 28vh;
      min-height: 120px;
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 14px;
      cursor: pointer;
      will-change: transform;
      transition: transform 0.14s ease, border-color 0.14s ease, background-color 0.14s ease;
    }

    .menu-card svg {
      width: 44px;
      height: 44px;
      stroke: var(--text-main);
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .menu-label {
      font-size: clamp(13px, 1.2vw, 18px);
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-main);
      text-align: center;
    }

    .promo-card {
      position: relative;
      height: 168px;
      max-height: 28vh;
      min-height: 120px;
      background: #120c08;
      border: 1.5px solid var(--card-border);
      border-radius: 14px;
      overflow: hidden;
      padding: 0;
      cursor: pointer;
      will-change: transform;
      transition: transform 0.14s ease, border-color 0.14s ease;
    }

    .promo-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .promo-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px;
      background: linear-gradient(135deg, rgba(64, 41, 26, 0.9), rgba(26, 17, 11, 0.95));
      color: var(--text-main);
      text-align: center;
    }

    .promo-badge {
      position: absolute;
      left: 10px;
      bottom: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 5px 10px;
      border-radius: 8px;
      background: rgba(15, 10, 7, 0.78);
      font-size: 13px;
      color: var(--text-main);
    }

    .promo-badge span:last-child {
      font-size: 11px;
      color: var(--focus-border);
      white-space: nowrap;
    }

    .menu-card:focus,
    .menu-card.tv-focused,
    .promo-card:focus,
    .promo-card.tv-focused {
      border-color: var(--focus-border);
      background: var(--focus-bg);
      transform: translateY(-3px) scale(1.02);
    }

    .tv-picker-modal {
      position: fixed;
      inset: 0;
      background: rgba(8, 5, 3, 0.88);
      z-index: 800;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }

    .tv-picker-modal.active {
      display: flex;
    }

    .tv-picker-box {
      width: min(860px, 94vw);
      background: linear-gradient(160deg, #352216, #1d120c);
      border: 1.5px solid var(--focus-border);
      border-radius: 18px;
      padding: 26px 30px;
    }

    .tv-picker-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .tv-picker-title {
      font-size: 26px;
      font-weight: 600;
      color: var(--text-main);
    }

    .tv-picker-sub {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .tv-picker-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .tv-app-btn {
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 16px;
      padding: 20px 16px;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      will-change: transform;
      transition: transform 0.12s ease, border-color 0.12s ease, background-color 0.12s ease;
    }

    .tv-app-logo-wrap {
      width: 78px;
      height: 78px;
      border-radius: 18px;
      background: rgba(255, 244, 228, 0.08);
      border: 1px solid rgba(255, 235, 210, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .tv-app-logo-img {
      width: 66px;
      height: 66px;
      object-fit: contain;
      border-radius: 12px;
    }

    .tv-app-logo-svg {
      width: 44px;
      height: 44px;
      stroke: var(--focus-border);
      fill: none;
      stroke-width: 1.8;
    }

    .tv-app-name {
      font-size: 20px;
      font-weight: 600;
      text-align: center;
      color: var(--text-main);
    }

    .tv-app-pkg {
      font-size: 12px;
      color: var(--text-muted);
      word-break: break-all;
      text-align: center;
    }

    .tv-app-btn:focus,
    .tv-app-btn.picker-focused,
    .tv-cancel-btn:focus,
    .tv-cancel-btn.picker-focused {
      border-color: var(--focus-border);
      background: var(--focus-bg);
      transform: translateY(-3px) scale(1.03);
    }

    .tv-picker-footer {
      margin-top: 20px;
      display: flex;
      justify-content: flex-end;
    }

    .tv-cancel-btn {
      padding: 10px 22px;
      border-radius: 10px;
      border: 1.5px solid var(--card-border);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      font-size: 15px;
      cursor: pointer;
    }

    .fullscreen-promo {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 999;
      display: none;
    }

    .fullscreen-promo.active {
      display: block;
    }

    .fullscreen-promo video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .fullscreen-hint {
      position: absolute;
      top: 20px;
      right: 28px;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 15px;
    }

    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 14, 10, 0.94);
      border: 1px solid var(--focus-border);
      color: var(--text-main);
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 1100;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="screen">
    <div class="top-bar">
      <div class="welcome-box">
        <div id="hotelBrandRow" class="hotel-brand-row">
          <img id="hotelLogoImg" class="hotel-logo-img" alt="Hotel Logo" />
          <span id="hotelBrandName" class="hotel-brand-name">HOTEL</span>
        </div>
        <h1 id="welcomeHeading" class="welcome-title">Welcome<br>Guest</h1>
        <div id="roomSubText" class="welcome-room">Room 101</div>
        <div id="wifiBox" class="wifi-info">
          <svg viewBox="0 0 24 24">
            <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
            <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
            <circle cx="12" cy="20" r="1"></circle>
          </svg>
          <span id="wifiText"></span>
        </div>
      </div>

      <div class="meta-box">
        <div class="clock-line">
          <span id="rightDateText">Tuesday, November 24</span>
          <span id="clockTime" class="time-strong">9:00 PM</span>
        </div>

        <div class="weather-row">
          <svg class="weather-icon" viewBox="0 0 64 64">
            <circle cx="24" cy="24" r="9"></circle>
            <path d="M24 6v5M24 37v5M6 24h5M37 24h5M11.3 11.3l3.5 3.5M33.2 33.2l3.5 3.5M36.7 11.3l-3.5 3.5M14.8 33.2l-3.5 3.5"></path>
            <path d="M24 44h22a9 9 0 0 0 1.4-17.9A12 12 0 0 0 24.4 22"></path>
          </svg>
          <div id="weatherMain" class="weather-temp-main">22°C</div>
          <div class="weather-temp-sub">
            <div id="weatherHigh">22°C</div>
            <div id="weatherLow">(18)</div>
          </div>
        </div>

        <button id="langBtn" class="lang-switch tv-nav" data-action="lang">
          <span id="langEn" class="active-lang">English</span>
          <span>/</span>
          <span id="langJa">日本語</span>
          <span>/</span>
          <span id="langZh">中文</span>
          <span>/</span>
          <span id="langKo">한국어</span>
        </button>
      </div>
    </div>

    <div class="bottom-grid">
      <button class="menu-card tv-nav" data-action="tv">
        <svg viewBox="0 0 64 64">
          <rect x="10" y="18" width="44" height="32" rx="4"></rect>
          <path d="M22 8l10 10 10-10"></path>
        </svg>
        <span id="lblTv" class="menu-label">TV CHANNELS</span>
      </button>

      <button class="menu-card tv-nav" data-action="movies">
        <svg viewBox="0 0 64 64">
          <rect x="10" y="18" width="44" height="32" rx="4"></rect>
          <path d="M10 26h44"></path>
          <path d="M14 18l6-8h8l-6 8M28 18l6-8h8l-6 8M42 18l6-8h4l-6 8"></path>
        </svg>
        <span id="lblMovies" class="menu-label">MOVIES</span>
      </button>

      <button class="menu-card tv-nav" data-action="services">
        <svg viewBox="0 0 64 64">
          <path d="M14 44a18 18 0 0 1 36 0Z"></path>
          <path d="M32 22v4M26 22h12M10 48h44"></path>
        </svg>
        <span id="lblServices" class="menu-label">HOTEL SERVICES</span>
      </button>

      <button class="menu-card tv-nav" data-action="roomservice">
        <svg viewBox="0 0 64 64">
          <path d="M18 14v14a6 6 0 0 0 12 0V14M24 14v36"></path>
          <path d="M42 14v36M42 14c5 0 8 5 8 13v5h-8"></path>
        </svg>
        <span id="lblRoomService" class="menu-label">ROOM SERVICE</span>
      </button>

      <button id="promoCard" class="promo-card tv-nav" data-action="promo">
        <video id="miniPromoVideo" autoplay muted playsinline preload="metadata"></video>
        <div id="promoFallback" class="promo-fallback">
          <strong style="font-size: 18px;">HOTEL HIGHLIGHTS</strong>
          <span style="font-size: 13px; color: var(--text-muted);">Chưa có video quảng cáo chung</span>
        </div>
        <div class="promo-badge">
          <span id="promoTitle">Promotions</span>
          <span id="promoHint">OK: Fullscreen</span>
        </div>
      </button>
    </div>
  </div>

  <div id="tvPickerModal" class="tv-picker-modal">
    <div class="tv-picker-box">
      <div class="tv-picker-header">
        <div>
          <div id="tvPickerTitle" class="tv-picker-title">Select TV App</div>
          <div id="tvPickerSub" class="tv-picker-sub">Use D-pad / OK to launch, Back to return</div>
        </div>
      </div>

      <div id="tvPickerGrid" class="tv-picker-grid"></div>

      <div class="tv-picker-footer">
        <button type="button" id="tvPickerCancelBtn" class="tv-cancel-btn tv-picker-item" data-cancel="1">Close</button>
      </div>
    </div>
  </div>

  <div id="fullscreenPromo" class="fullscreen-promo">
    <video id="fullPromoVideo" playsinline preload="metadata"></video>
    <div id="fullscreenHint" class="fullscreen-hint">Press any key to exit</div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const API_BASE = "https://hotel-tv-api.cuongnguyen787.workers.dev";
    const params = new URLSearchParams(window.location.search);
    const roomCode = (params.get("room") || "101").trim();
    const CACHE_KEY = `hotel_tv_state_${roomCode}_v2`;

    const LANG_ORDER = ["en", "ja", "zh", "ko"];

    const DEFAULT_TV_APPS = [
      { pkg: "com.nghenhin24h.vietplaytv", name: "Vietplaytv", icon: "" },
      { pkg: "vn.vtvcab.vtvprime.atv", name: "VTVprime", icon: "" },

    const DEFAULT_MOVIE_APPS = [

    const I18N = {

        pickerTitleTv: "TV 앱 선택",
        pickerTitleMovies: "영화·동영상 앱 선택",
        pickerSub: "방향키 / OK로 실행, 뒤로 가기로 닫기",
        pickerClose: "닫기",
        wifiPrefix: "Wi-Fi",
        passLabel: "비밀번호"
      }
    };

    let currentLang = "en";
    let manualLangOverride = false;
    let activePromos = [];
    let currentPromoIdx = 0;
    let lastPromoSignature = "";
    let lastBgUrl = "";
    let lastLogoUrl = "";
    let isFullscreenPromo = false;
    let isTvPickerOpen = false;
    let pickerMode = "tv";
    let returnFocusIndex = 1;
    let isLauncherPaused = false;
    let isSyncing = false;

    const miniVideo = document.getElementById("miniPromoVideo");
    const fullVideo = document.getElementById("fullPromoVideo");
    const promoFallback = document.getElementById("promoFallback");
    const promoTitleEl = document.getElementById("promoTitle");
    const tvPickerModal = document.getElementById("tvPickerModal");
    const tvPickerGrid = document.getElementById("tvPickerGrid");
    const cancelBtn = document.getElementById("tvPickerCancelBtn");
    const wifiBox = document.getElementById("wifiBox");
    const wifiText = document.getElementById("wifiText");
    const hotelLogoImg = document.getElementById("hotelLogoImg");
    const hotelBrandName = document.getElementById("hotelBrandName");
    let pickerItems = [];
    let pickerFocusIdx = 0;

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => el.classList.remove("show"), 2500);
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function applyHotelBrand(record, state) {
      const name = String(
        state.hotelName || state.hotelTitle || record.hotelName || ""
      ).trim();
      hotelBrandName.textContent = name || "HOTEL";

      const logo = String(
        state.hotelLogo || state.logoUrl || record.hotelLogo || ""
      ).trim();
      if (logo !== lastLogoUrl) {
        lastLogoUrl = logo;
        if (logo) {
          hotelLogoImg.src = logo;
          hotelLogoImg.classList.add("visible");
        } else {
          hotelLogoImg.removeAttribute("src");
          hotelLogoImg.classList.remove("visible");
        }
      }
    }

    hotelLogoImg.addEventListener("error", () => {
      hotelLogoImg.classList.remove("visible");
    });

    function applyBackgroundImage(url) {
      const cleanUrl = String(url || "").trim();
      if (cleanUrl === lastBgUrl) return;
      lastBgUrl = cleanUrl;

      if (cleanUrl) {
        const safeUrl = cleanUrl.replace(/"/g, "%22");
        document.body.style.backgroundImage = `url("${safeUrl}")`;
        document.body.classList.add("has-bg-image");
      } else {
        document.body.style.backgroundImage = "";
        document.body.classList.remove("has-bg-image");
      }
    }

    function applyWifiInfo(record, state, dict) {
      const ssid = String(
        record.wifiName || record.wifiSsid || record.wifi || state.wifiName || state.wifiSsid || ""
      ).trim();
      const pass = String(
        record.wifiPass || record.wifiPassword || record.password || state.wifiPass || state.wifiPassword || ""
      ).trim();

      if (!ssid && !pass) {
        wifiBox.classList.remove("visible");
        wifiText.innerHTML = "";
        return;
      }

      const parts = [];
      if (ssid) parts.push(`${escapeHtml(dict.wifiPrefix)}: <strong>${escapeHtml(ssid)}</strong>`);
      if (pass) parts.push(`${escapeHtml(dict.passLabel)}: <strong>${escapeHtml(pass)}</strong>`);
      wifiText.innerHTML = parts.join(" &nbsp;•&nbsp; ");
      wifiBox.classList.add("visible");
    }

    function getAppsForMode(mode) {
      if (mode === "movies") {
        let apps = DEFAULT_MOVIE_APPS;
        if (window.AndroidBridge && typeof window.AndroidBridge.getMovieAppsJson === "function") {
          try {
            const parsed = JSON.parse(window.AndroidBridge.getMovieAppsJson());
            if (Array.isArray(parsed) && parsed.length > 0) {
              apps = parsed;
            }
          } catch (_e) {}
        }
        return apps;
      }

      let apps = DEFAULT_TV_APPS;
      if (window.AndroidBridge && typeof window.AndroidBridge.getTvAppsJson === "function") {
        try {
          const parsed = JSON.parse(window.AndroidBridge.getTvAppsJson());
          if (Array.isArray(parsed) && parsed.length > 0) {
            apps = parsed;
          }
        } catch (_e) {}
      }
      return apps;
    }

    function updatePickerTexts() {
      const dict = I18N[currentLang] || I18N.en;
      document.getElementById("tvPickerTitle").textContent =
        pickerMode === "movies" ? dict.pickerTitleMovies : dict.pickerTitleTv;
      document.getElementById("tvPickerSub").textContent = dict.pickerSub;
      cancelBtn.textContent = dict.pickerClose;
    }

    function renderAppCards(mode) {
      const apps = getAppsForMode(mode);
      tvPickerGrid.innerHTML = apps.map((app) => {
        const hasIcon = app.icon && String(app.icon).startsWith("data:image/");
        const logoHtml = hasIcon
          ? `<img class="tv-app-logo-img" src="${escapeHtml(app.icon)}" alt="${escapeHtml(app.name)}" />`
          : `<svg class="tv-app-logo-svg" viewBox="0 0 64 64"><rect x="10" y="18" width="44" height="32" rx="4"></rect><path d="M22 8l10 10 10-10"></path></svg>`;

        return `
          <button type="button" class="tv-app-btn tv-picker-item" data-pkg="${escapeHtml(app.pkg)}" data-name="${escapeHtml(app.name)}">
            <div class="tv-app-logo-wrap">${logoHtml}</div>
            <span class="tv-app-name">${escapeHtml(app.name)}</span>
            <span class="tv-app-pkg">${escapeHtml(app.pkg)}</span>
          </button>
        `;
      }).join("");

      const appButtons = Array.from(tvPickerGrid.querySelectorAll(".tv-picker-item"));
      pickerItems = [...appButtons, cancelBtn];

      pickerItems.forEach((el, idx) => {
        el.onmouseenter = () => setPickerFocus(idx);
        el.onclick = () => {
          setPickerFocus(idx);
          if (el.dataset.cancel === "1") {
            closeTvPicker();
          } else {
            launchSelectedPackage(el.dataset.pkg, el.dataset.name);
          }
        };
      });
    }

    function setPickerFocus(idx) {
      if (!pickerItems.length) return;
      pickerFocusIdx = (idx + pickerItems.length) % pickerItems.length;
      pickerItems.forEach((el, i) => {
        el.classList.toggle("picker-focused", i === pickerFocusIdx);
      });
      pickerItems[pickerFocusIdx].focus({ preventScroll: true });
    }

    function openAppPicker(mode, focusBackIdx) {
      pickerMode = mode === "movies" ? "movies" : "tv";
      returnFocusIndex = typeof focusBackIdx === "number" ? focusBackIdx : 1;
      updatePickerTexts();
      renderAppCards(pickerMode);
      isTvPickerOpen = true;
      miniVideo.pause();
      tvPickerModal.classList.add("active");
      setPickerFocus(0);
    }

    function openTvPicker() {
      openAppPicker("tv", 1);
    }

    function openMoviePicker() {
      openAppPicker("movies", 2);
    }

    function closeTvPicker() {
      if (!isTvPickerOpen) return;
      isTvPickerOpen = false;
      tvPickerModal.classList.remove("active");
      pickerItems.forEach(el => el.classList.remove("picker-focused"));
      if (!isLauncherPaused && activePromos.length) {
        miniVideo.play().catch(() => {});
      }
      setFocus(returnFocusIndex);
    }

    function launchSelectedPackage(pkg, name) {
      closeTvPicker();
      if (pickerMode === "movies") {
        if (window.AndroidBridge && typeof window.AndroidBridge.launchApp === "function") {
          window.AndroidBridge.launchApp(pkg, name, roomCode);
          return;
        }
        if (window.AndroidBridge && typeof window.AndroidBridge.launchTvApp === "function") {
          window.AndroidBridge.launchTvApp(pkg, name, roomCode);
          return;
        }
      } else {
        if (window.AndroidBridge && typeof window.AndroidBridge.launchTvApp === "function") {
          window.AndroidBridge.launchTvApp(pkg, name, roomCode);
          return;
        }
        if (window.AndroidBridge && typeof window.AndroidBridge.launchApp === "function") {
          window.AndroidBridge.launchApp(pkg, name, roomCode);
          return;
        }
      }
      showToast(`[Phòng ${roomCode}] Mở ${name} (${pkg})`);
    }

    function updateClock() {
      const now = new Date();
      const loc = I18N[currentLang]?.locale || "en-US";
      const dateStr = now.toLocaleDateString(loc, {
        weekday: "long",
        month: "long",
        day: "numeric"
      });
      const timeStr = now.toLocaleTimeString(loc, {
        hour: "numeric",
        minute: "2-digit",
        hour12: true
      });

      document.getElementById("rightDateText").textContent = dateStr;
      document.getElementById("clockTime").textContent = timeStr;
    }

    function playMiniPromoAt(index) {
      if (!activePromos.length) {
        miniVideo.style.display = "none";
        promoFallback.style.display = "flex";
        promoTitleEl.textContent = "Promotions";
        return;
      }

      currentPromoIdx = index % activePromos.length;
      const item = activePromos[currentPromoIdx];
      promoFallback.style.display = "none";
      miniVideo.style.display = "block";
      promoTitleEl.textContent = item.title || `Promo #${currentPromoIdx + 1}`;

      miniVideo.muted = true;
      if (miniVideo.src !== item.url) {
        miniVideo.src = item.url;
        miniVideo.load();
      }
      if (!isLauncherPaused && !isTvPickerOpen && !isFullscreenPromo) {
        miniVideo.play().catch(() => {});
      }
    }

    miniVideo.addEventListener("ended", () => {
      playMiniPromoAt(currentPromoIdx + 1);
    });

    miniVideo.addEventListener("error", () => {
      if (activePromos.length > 1) {
        setTimeout(() => playMiniPromoAt(currentPromoIdx + 1), 1500);
      }
    });

    function openFullscreenPromo() {
      if (!activePromos.length) {
        showToast("Chưa có clip quảng cáo để phát toàn màn hình.");
        return;
      }
      isFullscreenPromo = true;
      miniVideo.pause();

      const item = activePromos[currentPromoIdx % activePromos.length];
      fullVideo.src = item.url;
      fullVideo.currentTime = miniVideo.currentTime || 0;
      fullVideo.muted = false;
      document.getElementById("fullscreenPromo").classList.add("active");
      fullVideo.load();
      fullVideo.play().catch(() => {
        fullVideo.muted = true;
        fullVideo.play().catch(() => {});
      });
    }

    function closeFullscreenPromo() {
      if (!isFullscreenPromo) return;
      isFullscreenPromo = false;
      fullVideo.pause();
      fullVideo.removeAttribute("src");
      fullVideo.load();
      document.getElementById("fullscreenPromo").classList.remove("active");
      miniVideo.muted = true;
      if (!isLauncherPaused) {
        miniVideo.play().catch(() => {});
      }
    }

    window.handleAndroidBack = function() {
      if (isFullscreenPromo) {
        closeFullscreenPromo();
        return true;
      }
      if (isTvPickerOpen) {
        closeTvPicker();
        return true;
      }
      return false;
    };

    window.onLauncherPause = function() {
      isLauncherPaused = true;
      miniVideo.pause();
      if (isFullscreenPromo) {
        fullVideo.pause();
      }
    };

    window.onLauncherResume = function() {
      isLauncherPaused = false;
      updateClock();
      syncFromCloud();
      if (!isTvPickerOpen && !isFullscreenPromo && activePromos.length) {
        miniVideo.play().catch(() => {});
      }
    };

    fullVideo.addEventListener("ended", () => {
      if (!activePromos.length) return;
      currentPromoIdx = (currentPromoIdx + 1) % activePromos.length;
      const item = activePromos[currentPromoIdx];
      fullVideo.src = item.url;
      fullVideo.load();
      fullVideo.play().catch(() => {});
    });

    function applyStateToUI(state) {
      if (!state || typeof state !== "object") return;
      const prevFocus = focusIndex;
      const record = state.room || {};
      const dispRoom = String(record.room || roomCode).trim();

      if (!manualLangOverride && record.lang && I18N[record.lang]) {
        currentLang = record.lang;
      }

      const dict = I18N[currentLang] || I18N.en;
      const rawGuest = String(record.guestName || "").trim();
      const guestDisplay =
        record.status === "vacant" || !rawGuest
          ? dict.defaultGuest
          : rawGuest;

      applyHotelBrand(record, state);

     const formattedGuest = escapeHtml(guestDisplay)
  .split(/\r?\n/)
  .map(line => line.trim())
  .filter(Boolean)
  .join("<br>");

document.getElementById("welcomeHeading").innerHTML =
  `${escapeHtml(dict.welcomePrefix)}<br>${formattedGuest || escapeHtml(dict.defaultGuest)}`;
      document.getElementById("roomSubText").textContent = dict.formatRoom(dispRoom);

      applyWifiInfo(record, state, dict);

      const bgCandidate =
        state.bgImage ||
        state.backgroundUrl ||
        state.bgUrl ||
        record.bgImage ||
        record.backgroundUrl ||
        "";
      applyBackgroundImage(bgCandidate);

      document.getElementById("lblTv").textContent = dict.tv;
      document.getElementById("lblMovies").textContent = dict.movies;
      document.getElementById("lblServices").textContent = dict.services;
      document.getElementById("lblRoomService").textContent = dict.roomService;
      document.getElementById("promoHint").textContent = dict.promoHint;
      document.getElementById("fullscreenHint").textContent = dict.fsHint;
      if (isTvPickerOpen) {
        updatePickerTexts();
      }

      document.getElementById("langEn").classList.toggle("active-lang", currentLang === "en");
      document.getElementById("langJa").classList.toggle("active-lang", currentLang === "ja");
      document.getElementById("langZh").classList.toggle("active-lang", currentLang === "zh");
      document.getElementById("langKo").classList.toggle("active-lang", currentLang === "ko");

      const tempMain = record.temp ?? 22;
      const tempLow = record.tempLow ?? 18;
      document.getElementById("weatherMain").textContent = `${tempMain}°C`;
      document.getElementById("weatherHigh").textContent = `${tempMain}°C`;
      document.getElementById("weatherLow").textContent = `(${tempLow})`;

      const list = Array.isArray(state.promos)
        ? state.promos.filter(p => p && p.active !== false && p.url && p.url.trim())
        : [];
      const sig = JSON.stringify(list.map(p => p.url));
      if (sig !== lastPromoSignature) {
        lastPromoSignature = sig;
        activePromos = list;
        playMiniPromoAt(0);
      }

      updateClock();
      if (!isTvPickerOpen && !isFullscreenPromo) {
        setFocus(prevFocus);
      }
    }

    async function syncFromCloud() {
      if (isLauncherPaused || isSyncing) return;
      isSyncing = true;
      try {
        const res = await fetch(`${API_BASE}/api/state?room=${encodeURIComponent(roomCode)}&_t=${Date.now()}`, {
          cache: "no-store"
        });
        const data = await res.json();
        if (data && data.ok) {
          localStorage.setItem(CACHE_KEY, JSON.stringify(data));
          applyStateToUI(data);
        }
      } catch (e) {
      } finally {
        isSyncing = false;
      }
    }

    window.syncFromCloud = syncFromCloud;

    function triggerAction(action) {
      if (action === "lang") {
        manualLangOverride = true;
        const nextIdx = (LANG_ORDER.indexOf(currentLang) + 1) % LANG_ORDER.length;
        currentLang = LANG_ORDER[nextIdx];
        let cachedObj = null;
        try {
          cachedObj = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
        } catch (e) {}
        if (cachedObj) applyStateToUI(cachedObj);
        else updateClock();
        return;
      }

      if (action === "tv") {
        openTvPicker();
        return;
      }

      if (action === "movies") {
        openMoviePicker();
        return;
      }

      if (action === "promo") {
        openFullscreenPromo();
        return;
      }

      if (window.AndroidBridge && typeof window.AndroidBridge.onMenuSelect === "function") {
        window.AndroidBridge.onMenuSelect(action, roomCode);
        return;
      }

      const names = {
        services: "HOTEL SERVICES (Tiện ích khách sạn)",
        roomservice: "ROOM SERVICE (Đặt dịch vụ phòng)"
      };
      showToast(`[Phòng ${roomCode}] → ${names[action] || action}`);
    }

    const navItems = Array.from(document.querySelectorAll(".tv-nav"));
    let focusIndex = 1;

    function setFocus(idx) {
      focusIndex = (idx + navItems.length) % navItems.length;
      navItems.forEach((el, i) => {
        el.classList.toggle("tv-focused", i === focusIndex);
      });
      navItems[focusIndex].focus({ preventScroll: true });
    }

    navItems.forEach((el, idx) => {
      el.addEventListener("click", () => {
        setFocus(idx);
        triggerAction(el.dataset.action);
      });
      el.addEventListener("mouseenter", () => setFocus(idx));
    });

    document.addEventListener("keydown", (e) => {
      if (isFullscreenPromo) {
        e.preventDefault();
        closeFullscreenPromo();
        return;
      }

      if (isTvPickerOpen) {
        e.preventDefault();
        if (e.key === "Escape" || e.keyCode === 4 || e.keyCode === 27) {
          closeTvPicker();
        } else if (e.key === "ArrowRight" || e.keyCode === 22 || e.key === "ArrowDown" || e.keyCode === 20) {
          setPickerFocus(pickerFocusIdx + 1);
        } else if (e.key === "ArrowLeft" || e.keyCode === 21 || e.keyCode === 19) {
          setPickerFocus(pickerFocusIdx - 1);
        } else if (e.key === "Enter" || e.keyCode === 23 || e.keyCode === 13) {
          const cur = pickerItems[pickerFocusIdx];
          if (cur && cur.dataset.cancel === "1") {
            closeTvPicker();
          } else if (cur) {
            launchSelectedPackage(cur.dataset.pkg, cur.dataset.name);
          }
        }
        return;
      }

      if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Enter"].includes(e.key) || e.keyCode === 23) {
        e.preventDefault();
      }

      if (e.key === "ArrowRight" || e.keyCode === 22) {
        setFocus(focusIndex + 1);
      } else if (e.key === "ArrowLeft" || e.keyCode === 21) {
        setFocus(focusIndex - 1);
      } else if (e.key === "ArrowDown" || e.keyCode === 20) {
        if (focusIndex === 0) setFocus(1);
      } else if (e.key === "ArrowUp" || e.keyCode === 19) {
        if (focusIndex >= 1) setFocus(0);
      } else if (e.key === "Enter" || e.keyCode === 23 || e.keyCode === 13) {
        triggerAction(navItems[focusIndex].dataset.action);
      }
    });

    document.getElementById("fullscreenPromo").addEventListener("click", closeFullscreenPromo);

    try {
      const initialCached = localStorage.getItem(CACHE_KEY);
      if (initialCached) applyStateToUI(JSON.parse(initialCached));
    } catch (e) {}

    updateClock();
    setFocus(1);
    syncFromCloud();
    setInterval(() => { if (!isLauncherPaused) updateClock(); }, 15000);
    setInterval(syncFromCloud, 15000);
  </script>
</body>
</html>
